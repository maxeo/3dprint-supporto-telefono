const DATA={"root":"..","title":"Supporto Telefono · Guida","theme":{"accent":"#2f6fa8","viewer_bg":"#1b1f24"},"header":{"eyebrow":"Supporto Telefono · pieghevole da scrivania · PETG","h1":"Si alza a tratti, si chiude piatto.","intro_html":"<b>Supporto per telefono da scrivania, pieghevole, con braccio telescopico, prolunghe e appoggio regolabile.</b> Le due cerniere sono viti M4 strette da un pomello zigrinato: la durezza la scegli a mano. Il braccio è fatto a tratti che si infilano uno nell'altro, ognuno con la sua <b>morsa</b> a pomello: senza prolunghe la mensola va da 123 a 232 mm dal tavolo, e ogni <b>prolunga</b> (P07, quante ne vuoi) aggiunge 100 mm più 40 di sfilo. L'<b>appoggio</b> scorre lungo il piatto per 73 mm su una guida a T e si blocca col suo pomello. Nella vista: 2 prolunghe.","facts":[{"value":"185 × 90 × 58 mm","label":"chiuso, senza prolunghe"},{"value":"123–232 mm","label":"mensola dal tavolo, senza prolunghe"},{"value":"+100 mm","label":"per ogni prolunga, più lo sfilo"},{"value":"solo M4","label":"2 × M4×50, M4×12 e dadi"}]},"camera":{"yaw":-0.9,"pitch":0.3},"caption":"Il supporto con 2 prolunghe, braccio dritto, piatto inclinato di 20° e appoggio in basso. In grigio le viti.","model_note_html":"<span class='badge'>Quote del modello</span><p>Altezza della mensola dal tavolo, braccio dritto, dal tutto chiuso al tutto sfilato con l'appoggio in alto: senza prolunghe 123–232 mm, con una 223–372, con due 323–512, con tre 423–652. Chiuso: 58 mm di spessore.</p>","groups":{"Base":{"color":"#c9ccd1"},"Braccio":{"color":"#7f9bb8"},"Prolunghe":{"color":"#6db38a"},"Piatto":{"color":"#3f86c4"},"Pomelli":{"color":"#454a52"}},"steps_section":{"eyebrow":"01 / Montaggio","h2":"Dal braccio al piatto.","intro_html":"Destra e sinistra guardando il supporto da davanti, dalla parte del telefono. Le viti sono tutte M4 a testa esagonale: basta una chiave da 7 o una pinza per tenere i dadi mentre li spingi nelle sedi.","start_html":"<h3>Prima i pomelli.</h3><p>Spingi un dado M4 nella sede dei tre pomelli delle cerniere e dell'appoggio (P06A, P06B, P06C) e la testa di una vite M4×12 nella sede di ogni pomello delle morse (P06D): entrano un po' forzati, premendo su un tavolo. Se ballano, una goccia di colla.</p>"},"print":{"eyebrow":"03 / Stampa","h2":"Sette file, un pomello per ogni morsa.","common_html":"<b>Profilo comune:</b> Kobra S1, ugello 0,4 mm, PETG, strato 0,20 mm. Sono parametri che <b>propongo io, da verificare</b>: il supporto non è ancora stato stampato. STL in millimetri, scala 100%, già orientati e appoggiati a Z = 0. Nessun pezzo ha bisogno di supporti. I pesi indicati sono a pezzo pieno: col riempimento consigliato vengono meno. Le quantità sono quelle con 2 prolunghe: per ogni prolunga in più o in meno conta una P07 e un pomello P06D.","profiles":[{"key":"base","title":"P01 · base","rows":[["Orientamento","piastra sul piatto, orecchie in su"],["Pareti","4"],["Riempimento","40% Gyroid"],["Supporti","no"]],"why":"La base fa da contrappeso: più è piena, meno il supporto si ribalta, soprattutto con le prolunghe. Le sedi esagonali sui fianchi hanno un vertice in alto, così il cielo si chiude senza supporti.","summary":"4 pareti · 40% · senza supporti"},{"key":"braccio","title":"P02 guaina · P07 prolunghe · P03 slitta","rows":[["Orientamento","faccia davanti (con la fessura) sul piatto, come negli STL"],["Pareti","4"],["Riempimento","30%"],["Supporti","no: il cielo del canale è un ponte di 24 mm"],["Compensazione zampa d'elefante","0,15 mm"]],"why":"La nervatura sotto ogni barra arriva fino alla faccia davanti: barra e tratto largo poggiano sul piatto insieme, quindi le prolunghe si stampano coricate senza supporti e le fibre corrono lungo il braccio. Barra e nervatura hanno 0,3 mm di gioco per lato: la compensazione del primo strato evita che la nervatura si allarghi e impunti nella fessura.","summary":"coricati · 4 pareti · 30%"},{"key":"piatto","title":"P04 · piatto","rows":[["Orientamento","faccia del telefono sul piatto, forchetta in su"],["Pareti","4"],["Riempimento","25%"],["Supporti","no: il cielo della cava è un ponte di 7,4 mm"]],"why":"La faccia su cui appoggia il telefono viene liscia dal piatto di stampa e la fessura della guida a T si apre proprio lì.","summary":"faccia giù · 4 pareti · 25%"},{"key":"appoggio","title":"P05 · appoggio","rows":[["Orientamento","su un fianco, come negli STL (alto 70 mm)"],["Pareti","4"],["Riempimento","40%"],["Supporti","no"],["Brim","5 mm consigliato"]],"why":"Su un fianco il profilo di flangia, mensola e sponda è tutto in pianta e sale dritto; il foro della vite viene orizzontale e piccolo. Il brim tiene fermo un pezzo alto e stretto.","summary":"di fianco · 4 pareti · brim"},{"key":"pomelli","title":"P06 · pomelli","rows":[["Orientamento","faccia con la sede esagonale sul piatto"],["Pareti","4"],["Riempimento","50%"],["Copie","3 + 1 per ogni morsa (6 con 2 prolunghe)"]],"why":"La sede esagonale stampata a contatto col piatto viene precisa e tiene il dado a pressione.","summary":"50% · un pomello per morsa"}],"extra_rows":[{"label":"Viteria (si compra)","what":"cerniere","file":"","quantity":2,"dims":"M4×50 testa esagonale + dado M4","print":""},{"label":"Viteria (si compra)","what":"appoggio","file":"","quantity":1,"dims":"M4×12 testa esagonale + dado M4","print":""},{"label":"Viteria (si compra)","what":"morse","file":"","quantity":3,"dims":"M4×12 testa esagonale + dado M4, una per guaina e prolunga","print":""},{"label":"Piedini adesivi (facoltativi)","what":"base","file":"","quantity":4,"dims":"Ø10 × 1 mm","print":""}],"note_html":"Le misure da cambiare sono in cima a <code>blender/costruisci.py</code>: <code>GIOCO_NOCCA</code> se le cerniere restano dure anche col pomello lento, <code>GIOCO_SLITTA</code> se barre e nervature scorrono male, <code>TELEFONO_MAX</code> per telefoni più spessi, <code>TRATTO</code> per prolunghe più corte o più lunghe. Lo script ricontrolla che nessun pezzo si tocchi (aperto, con le prolunghe e chiuso) e lo scrive in <code>dati/geometria.json</code>."},"notes":{"eyebrow":"04 / Cerniera e braccio","h2":"Una vite, un pomello, la frizione la scegli tu.","nav":"Giunti","cards":[{"title":"Sezione della cerniera","html":"<p>La nocca larga 30 sta fra due orecchie con 0,2 mm di gioco per lato. La testa della M4×50 entra in una sede esagonale profonda 3 e non gira; dall'altra parte il dado è chiuso nel pomello. Girando il pomello le orecchie si flettono un poco e serrano la nocca. Il pacco è 48,4 mm, la vite sporge 1,4 mm oltre il dado e resta nascosta nel pomello.</p><svg viewBox='0 0 460 200' xmlns='http://www.w3.org/2000/svg' font-size='11' font-family='sans-serif'><rect x='84.80000000000001' y='40' width='54.0' height='120' fill='#bfc3c9'/><rect x='321.2' y='40' width='54.0' height='120' fill='#bfc3c9'/><rect x='140.0' y='40' width='180.0' height='120' fill='#8aa1b8'/><rect x='86.0' y='79' width='16.799999999999997' height='42' fill='#777'/><rect x='102.80000000000001' y='88' width='300.0' height='24' fill='#999' opacity='.85'/><rect x='375.2' y='30' width='66.0' height='140' fill='#333' rx='6'/><rect x='375.2' y='79' width='19.200000000000003' height='42' fill='#777'/><text x='84.80000000000001' y='185'>orecchia 9</text><text x='182.0' y='30'>nocca 30</text><text x='84.80000000000001' y='22'>testa M4 in sede da 3</text><text x='365.2' y='185'>pomello + dado</text><text x='194.0' y='185'>gioco 0,2 per lato</text></svg>"},{"title":"Sezione del braccio","html":"<p>Ogni tratto (guaina e prolunghe) ha il canale con una fessura davanti; ogni barra (prolunghe e slitta) ha sotto una nervatura che corre nella fessura e arriva a filo. La morsa è una vite M4 nel rinforzo sul fianco: la punta preme nella scanalatura della barra, che finisce prima del fondo e fa da fermo.</p><svg viewBox='0 0 420 200' xmlns='http://www.w3.org/2000/svg' font-size='11' font-family='sans-serif'><rect x='45.0' y='30.0' width='210.0' height='140.0' fill='#8aa1b8' opacity='1'/><rect x='66.0' y='47.5' width='168.0' height='105.0' fill='#fff' opacity='1'/><rect x='101.0' y='152.5' width='98.0' height='17.5' fill='#fff' opacity='1'/><rect x='68.10000000000001' y='49.6' width='163.79999999999998' height='100.8' fill='#5aa678' opacity='0.9'/><rect x='103.1' y='149.0' width='93.8' height='21.0' fill='#5aa678' opacity='0.9'/><rect x='255.0' y='33.5' width='28.0' height='133.0' fill='#8aa1b8' opacity='1'/><line x1='30.0' y1='170.0' x2='320.0' y2='170.0' stroke='#888' stroke-dasharray='4 3'/><text x='290.0' y='95.0'>morsa</text><text x='290.0' y='109.0'>(vite M4)</text><text x='5.0' y='40.0'>canale 24 × 15</text><text x='5.0' y='55.0'>barra 23,4 × 14,4</text><text x='5.0' y='188.0'>faccia davanti = piatto di stampa</text><text x='180.0' y='188.0'>nervatura 13,4 in fessura 14</text></svg>"},{"title":"Stabilità","html":"<p>Con un telefono da 200 g, braccio a 95° e appoggio in basso il baricentro cade 21 mm dentro la base; con l'appoggio tutto in alto e il braccio a 95° cadrebbe fuori (-3,9 mm), col braccio dritto torna dentro (7,6 mm). Con le prolunghe tieni il braccio dritto: il peso resta sopra la base, ma ogni grado di inclinazione sposta il telefono di più.</p>"},{"title":"Se la cerniera scivola","html":"<p>Stringi il pomello. Se anche stretto non tiene (PETG molto liscio), metti una rondella di gomma o di sughero da 0,5–1 mm fra nocca e orecchia, oppure riduci <code>GIOCO_NOCCA</code> a 0,1 e ristampa. Non stringere con la chiave: le orecchie si aprono.</p>"}]},"files":{"h2":"I file.","intro_html":"Gli STL sono in <code>stl/</code>; la scena e lo script che li genera in <code>blender/</code>. Nella scena le collezioni nascoste <b>CON_PROLUNGHE</b> e <b>PIEGATO</b> mostrano il supporto con due prolunghe e chiuso.","links":[{"label":"README","href":"README.md"},{"label":"Scena Blender","href":"blender/Supporto_Telefono.blend"},{"label":"Script di costruzione","href":"blender/costruisci.py"},{"label":"Misure e controlli","href":"dati/geometria.json"},{"label":"Foto d // Ricerca fra le stampanti (combobox): campo di testo + elenco filtrato, frecce/Invio/Esc.
// Usato da stampante.py (guide) e dall'indice 3dprint-guide. MODELLI = [[nome, x, y, z], ...].
function StampanteCerca(inp, ul, MODELLI, scegli) {
  const piega = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const fmt = v => Number(v).toLocaleString('it-IT');
  const IDX = MODELLI.map(m => piega(`${m[0]} ${m[1]}x${m[2]}x${m[3]}`));
  const MAX = 80;
  // parole cercate evidenziate nel nome: posizioni calcolate sul testo "piegato" carattere per carattere
  const segna = (t, w) => {
    const p = [...t].map(c => { const f = piega(c); return f.length === 1 ? f : f[0] || " "; }).join(""), on = new Array(t.length).fill(false);
    for (const x of w) for (let i = p.indexOf(x); i >= 0; i = p.indexOf(x, i + 1)) on.fill(true, i, i + x.length);
    let h = "", a = false;
    [...t].forEach((c, i) => { if (on[i] !== a) { h += on[i] ? "<mark>" : "</mark>"; a = on[i]; } h += esc(c); });
    return h + (a ? "</mark>" : "");
  };
  let res = [], att = -1;
  const id = ul.id || (ul.id = 'st-lista-' + Math.random().toString(36).slice(2, 8));
  inp.setAttribute('role', 'combobox'); inp.setAttribute('aria-controls', id); inp.setAttribute('aria-autocomplete', 'list'); inp.setAttribute('aria-expanded', 'false');
  ul.setAttribute('role', 'listbox');
  const evidenzia = () => {
    [...ul.querySelectorAll('[role=option]')].forEach((li, k) => {
      const on = k === att; li.setAttribute('aria-selected', on);
      if (on) { inp.setAttribute('aria-activedescendant', li.id); li.scrollIntoView({block: 'nearest'}); }
    });
    if (att < 0) inp.removeAttribute('aria-activedescendant');
  };
  const apri = () => {
    // tutte le parole, in qualsiasi ordine; "combo" e simili contano come le altre
    const w = piega(inp.value).replace(/×/g, 'x').split(/\s+/).filter(Boolean);
    res = []; for (let i = 0; i < MODELLI.length; i++) if (w.every(x => IDX[i].includes(x))) res.push(i);
    att = res.length ? 0 : -1;
    ul.innerHTML = res.length
      ? res.slice(0, MAX).map((i, k) => `<li role="option" id="${id}-${k}" data-i="${i}"><span>${segna(MODELLI[i][0], w)}</span><small>${fmt(MODELLI[i][1])} × ${fmt(MODELLI[i][2])} × ${fmt(MODELLI[i][3])}</small></li>`).join('')
        + (res.length > MAX ? `<li class="st-altre">Altre ${res.length - MAX}: scrivi marca o modello</li>` : '')
      : '<li class="st-altre">Nessuna stampante trovata: inserisci X, Y, Z a mano.</li>';
    ul.hidden = false; inp.setAttribute('aria-expanded', 'true'); evidenzia();
  };
  const chiudi = () => { ul.hidden = true; inp.setAttribute('aria-expanded', 'false'); inp.removeAttribute('aria-activedescendant'); };
  const prendi = i => { const m = MODELLI[i]; if (!m) return; inp.value = ''; chiudi(); scegli({x: m[1], y: m[2], z: m[3], nome: m[0]}); };
  inp.addEventListener('input', apri);
  inp.addEventListener('focus', apri);
  inp.addEventListener('blur', () => setTimeout(chiudi, 120));
  inp.addEventListener('keydown', e => {
    const n = Math.min(res.length, MAX);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (ul.hidden) return apri();
      if (n) { att = (att + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; evidenzia(); }
    } else if (e.key === 'Enter') {
      if (!ul.hidden && att >= 0) { e.preventDefault(); prendi(res[att]); }
    } else if (e.key === 'Escape' && !ul.hidden) {
      e.preventDefault(); e.stopPropagation(); chiudi();
    }
  });
  // mousedown: sceglie prima che il blur chiuda l'elenco
  ul.addEventListener('mousedown', e => { const li = e.target.closest('[data-i]'); e.preventDefault(); if (li) prendi(+li.dataset.i); });
  ul.addEventListener('mousemove', e => { const li = e.target.closest('[data-i]'); if (!li) return; const k = [...ul.children].indexOf(li); if (k !== att) { att = k; evidenzia(); } });
}
const PERM=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
const fmt=v=>Number(v).toLocaleString('it-IT',{maximumFractionDigits:1});
const cbs=[];
function get(){try{const b=JSON.parse(localStorage.getItem(KEY)||'null');if(b&&['x','y','z'].every(k=>b[k]>0))return b}catch(_){}return {...DEF}}
function set(b){try{localStorage.setItem(KEY,JSON.stringify(b))}catch(_){}update()}
// Un pezzo entra se esiste un'orientazione a 90° con ogni misura entro l'area.
function fits(d,b=get()){const B=[b.x,b.y,b.z];return PERM.some(o=>o.every((a,k)=>d[a]<=B[k]+1e-6))}
// dims dai builder attuali, dimensions_mm dalle guide generate da uno spec Blender (Supporto per Tablet)
const parti=()=>typeof DATA!=='undefined'&&DATA&&Array.isArray(DATA.parts)?DATA.parts.filter(p=>!p.ghost).map(p=>({...p,dims:p.dims||p.dimensions_mm})).filter(p=>Array.isArray(p.dims)):[];
const testo=b=>`${fmt(b.x)} × ${fmt(b.y)} × ${fmt(b.z)} mm`;
let top,btn,pop,avviso;
function check(){const b=get(),fuori=parti().filter(p=>!fits(p.dims,b));
  if(btn){btn.querySelector('b').textContent=`${fmt(b.x)} × ${fmt(b.y)}`;btn.classList.toggle('fuori',fuori.length>0);
    btn.title=(b.nome?b.nome+' · ':'')+(fuori.length?`Area di stampa ${testo(b)}: ${fuori.length} pezzi non entrano`:`Area di stampa ${testo(b)}`);
    const e=pop.querySelector('.stampante-esito');e.textContent=fuori.length?`Non entrano: ${fuori.map(p=>p.id).join(', ')}.`:(parti().length?'Tutti i pezzi entrano.':'');e.classList.toggle('fuori',fuori.length>0)}
  if(avviso){avviso.hidden=!fuori.length;avviso.innerHTML=fuori.length?`<b>Attenzione: ${fuori.length===1?'un pezzo non entra':fuori.length+' pezzi non entrano'} nell’area di stampa ${testo(b)}.</b> ${fuori.map(p=>`${p.id}${p.label&&p.label!==p.id?' '+p.label:''} (${p.dims.map(fmt).join(' × ')} mm)`).join(', ')}. ${window.STAMPANTE_SUGGERIMENTO||'Scala o dividi questi pezzi, oppure imposta la tua stampante con il pulsante <i>Stampante</i> in alto.'}`:''}
  const ids=new Set(fuori.map(p=>p.id));
  document.querySelectorAll('tr[data-id]').forEach(tr=>{const f=ids.has(tr.dataset.id);tr.classList.toggle('stampante-fuori',f);let t=tr.querySelector('.stampante-tag');
    if(f&&!t){t=document.createElement('span');t.className='stampante-tag';t.textContent='non entra';(tr.children[1]||tr.children[0]).appendChild(t)}else if(!f&&t)t.remove()});
  return fuori}
function update(){check();for(const cb of cbs)try{cb(get())}catch(e){console.error(e)}}
function monta(){
  top=document.querySelector('.guida-top');if(!top){top=document.createElement('div');top.className='guida-top';document.body.insertBefore(top,document.body.firstChild)}
  const w=document.createElement('div');w.className='stampante-wrap';
  w.innerHTML=`<button type="button" class="stampante-btn" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 21h10M9 17v4M15 17v4"/></svg><span class="st-parola">Stampante</span> <b></b><i></i></button><div class="stampante-pop" hidden><b>Area di stampa</b><p>Dimensioni massime della tua stampante, in mm. Vale per tutte le guide: serve a segnalare i pezzi che non entrano.</p><div class="stampante-xyz">${['x','y','z'].map(k=>`<label><span>${k.toUpperCase()}</span><input data-k="${k}" type="number" min="50" max="2000" step="1" inputmode="numeric"></label>`).join('')}</div><p class="stampante-nome"></p><div class="st-cerca"><input type="search" placeholder="Cerca fra ${MODELLI.length} stampanti…" aria-label="Cerca la tua stampante" autocomplete="off" spellcheck="false"><ul hidden></ul></div><p class="stampante-esito"></p></div>`;
  top.insertBefore(w,top.firstChild);btn=w.querySelector('button');pop=w.querySelector('.stampante-pop');
  const inputs=[...pop.querySelectorAll('input')],xyz=inputs.filter(i=>i.dataset.k),nome=pop.querySelector('.stampante-nome'),carica=()=>{const b=get();xyz.forEach(i=>i.value=b[i.dataset.k]);nome.textContent=b.nome||''};carica();
  // a mano: il nome del modello non vale piu'
  xyz.forEach(i=>i.addEventListener('input',()=>{const v=Number(i.value);if(v>0){const b={...get(),[i.dataset.k]:v};delete b.nome;set(b);nome.textContent=''}}));
  StampanteCerca(pop.querySelector('.st-cerca input'),pop.querySelector('.st-cerca ul'),MODELLI,b=>{set(b);carica()});
  const mostra=on=>{pop.hidden=!on;btn.setAttribute('aria-expanded',on)};
  btn.addEventListener('click',e=>{e.stopPropagation();mostra(pop.hidden)});
  document.addEventListener('click',e=>{if(!pop.hidden&&!w.contains(e.target))mostra(false)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pop.hidden){mostra(false);btn.focus()}});
  // il pulsante del tema (tema.py) va nello stesso contenitore, dopo questo
  const sposta=()=>{const t=document.querySelector('.tema-guida');if(t&&t.parentNode!==top)top.appendChild(t)};sposta();
  new MutationObserver(sposta).observe(document.body,{childList:true});
  const main=document.querySelector('main');avviso=document.createElement('p');avviso.className='warning stampante-avviso';avviso.hidden=true;avviso.setAttribute('role','status');
  if(main)main.insertBefore(avviso,main.firstChild);
  addEventListener('storage',e=>{if(e.key===KEY){carica();update()}});
  check()}
window.StampanteGuide={get,set,fits,check,onChange:cb=>cbs.push(cb)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',monta);else monta();
})();</script><!--STAMPANTE-FINE-->
