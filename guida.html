// Ricerca fra le stampanti (combobox): campo di testo + elenco filtrato, frecce/Invio/Esc.
// Usato da stampante.py (guide) e dall'indice 3dprint-guide. MODELLI = [[nome, x, y, z], ...].
function StampanteCerca(inp, ul, MODELLI, scegli) {
  const piega = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const fmt = v => Number(v).toLocaleString('it-IT');
  const IDX = MODELLI.map(m => piega(`${m[0]} ${m[1]}x${m[2]}x${m[3]}`));
  const MAX = 80;
  // parole cercate evidenziate nel nome: posizioni calcolate sul testo "piegato" carattere per carattere
  const segna = (t, w) => {
    const p = [...t].map(c => { const f = piega(c); return f.length === 1 ? f : f[0] || " "; }).join(""), on = new Array(t.length).fill(false);
    for (const x of w) for (let i = p.indexOf(x); i >= 0; i = p.indexOf(x, i + 1)) on.fill(true, i, i + x.length);
    let h = "", a = false;
    [...t].forEach((c, i) => { if (on[i] !== a) { h += on[i] ? "<mark>" : "</mark>"; a = on[i]; } h += esc(c); });
    return h + (a ? "</mark>" : "");
  };
  let res = [], att = -1;
  const id = ul.id || (ul.id = 'st-lista-' + Math.random().toString(36).slice(2, 8));
  inp.setAttribute('role', 'combobox'); inp.setAttribute('aria-controls', id); inp.setAttribute('aria-autocomplete', 'list'); inp.setAttribute('aria-expanded', 'false');
  ul.setAttribute('role', 'listbox');
  const evidenzia = () => {
    [...ul.querySelectorAll('[role=option]')].forEach((li, k) => {
      const on = k === att; li.setAttribute('aria-selected', on);
      if (on) { inp.setAttribute('aria-activedescendant', li.id); li.scrollIntoView({block: 'nearest'}); }
    });
    if (att < 0) inp.removeAttribute('aria-activedescendant');
  };
  const apri = () => {
    // tutte le parole, in qualsiasi ordine; "combo" e simili contano come le altre
    const w = piega(inp.value).replace(/×/g, 'x').split(/\s+/).filter(Boolean);
    res = []; for (let i = 0; i < MODELLI.length; i++) if (w.every(x => IDX[i].includes(x))) res.push(i);
    att = res.length ? 0 : -1;
    ul.innerHTML = res.length
      ? res.slice(0, MAX).map((i, k) => `<li role="option" id="${id}-${k}" data-i="${i}"><span>${segna(MODELLI[i][0], w)}</span><small>${fmt(MODELLI[i][1])} × ${fmt(MODELLI[i][2])} × ${fmt(MODELLI[i][3])}</small></li>`).join('')
        + (res.length > MAX ? `<li class="st-altre">Altre ${res.length - MAX}: scrivi marca o modello</li>` : '')
      : '<li class="st-altre">Nessuna stampante trovata: inserisci X, Y, Z a mano.</li>';
    ul.hidden = false; inp.setAttribute('aria-expanded', 'true'); evidenzia();
  };
  const chiudi = () => { ul.hidden = true; inp.setAttribute('aria-expanded', 'false'); inp.removeAttribute('aria-activedescendant'); };
  const prendi = i => { const m = MODELLI[i]; if (!m) return; inp.value = ''; chiudi(); scegli({x: m[1], y: m[2], z: m[3], nome: m[0]}); };
  inp.addEventListener('input', apri);
  inp.addEventListener('focus', apri);
  inp.addEventListener('blur', () => setTimeout(chiudi, 120));
  inp.addEventListener('keydown', e => {
    const n = Math.min(res.length, MAX);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (ul.hidden) return apri();
      if (n) { att = (att + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; evidenzia(); }
    } else if (e.key === 'Enter') {
      if (!ul.hidden && att >= 0) { e.preventDefault(); prendi(res[att]); }
    } else if (e.key === 'Escape' && !ul.hidden) {
      e.preventDefault(); e.stopPropagation(); chiudi();
    }
  });
  // mousedown: sceglie prima che il blur chiuda l'elenco
  ul.addEventListener('mousedown', e => { const li = e.target.closest('[data-i]'); e.preventDefault(); if (li) prendi(+li.dataset.i); });
  ul.addEventListener('mousemove', e => { const li = e.target.closest('[data-i]'); if (!li) return; const k = [...ul.children].indexOf(li); if (k !== att) { att = k; evidenzia(); } });
}

function set(b){try{localStorage.setItem(KEY,JSON.stringify(b))}catch(_){}update()}
// Un pezzo entra se esiste un'orientazione a 90° con ogni misura entro l'area.
function fits(d,b=get()){const B=[b.x,b.y,b.z];return PERM.some(o=>o.every((a,k)=>d[a]<=B[k]+1e-6))}
// dims dai builder attuali, dimensions_mm dalle guide generate da uno spec Blender (Supporto per Tablet)
const parti=()=>typeof DATA!=='undefined'&&DATA&&Array.isArray(DATA.parts)?DATA.parts.filter(p=>!p.ghost).map(p=>({...p,dims:p.dims||p.dimensions_mm})).filter(p=>Array.isArray(p.dims)):[];
const testo=b=>`${fmt(b.x)} × ${fmt(b.y)} × ${fmt(b.z)} mm`;
let top,btn,pop,avviso;
function check(){const b=get(),fuori=parti().filter(p=>!fits(p.dims,b));
  if(btn){btn.querySelector('b').textContent=`${fmt(b.x)} × ${fmt(b.y)}`;btn.classList.toggle('fuori',fuori.length>0);
    btn.title=(b.nome?b.nome+' · ':'')+(fuori.length?`Area di stampa ${testo(b)}: ${fuori.length} pezzi non entrano`:`Area di stampa ${testo(b)}`);
    const e=pop.querySelector('.stampante-esito');e.textContent=fuori.length?`Non entrano: ${fuori.map(p=>p.id).join(', ')}.`:(parti().length?'Tutti i pezzi entrano.':'');e.classList.toggle('fuori',fuori.length>0)}
  if(avviso){avviso.hidden=!fuori.length;avviso.innerHTML=fuori.length?`<b>Attenzione: ${fuori.length===1?'un pezzo non entra':fuori.length+' pezzi non entrano'} nell’area di stampa ${testo(b)}.</b> ${fuori.map(p=>`${p.id}${p.label&&p.label!==p.id?' '+p.label:''} (${p.dims.map(fmt).join(' × ')} mm)`).join(', ')}. ${window.STAMPANTE_SUGGERIMENTO||'Scala o dividi questi pezzi, oppure imposta la tua stampante con il pulsante <i>Stampante</i> in alto.'}`:''}
  const ids=new Set(fuori.map(p=>p.id));
  document.querySelectorAll('tr[data-id]').forEach(tr=>{const f=ids.has(tr.dataset.id);tr.classList.toggle('stampante-fuori',f);let t=tr.querySelector('.stampante-tag');
    if(f&&!t){t=document.createElement('span');t.className='stampante-tag';t.textContent='non entra';(tr.children[1]||tr.children[0]).appendChild(t)}else if(!f&&t)t.remove()});
  return fuori}
function update(){check();for(const cb of cbs)try{cb(get())}catch(e){console.error(e)}}
function monta(){
  top=document.querySelector('.guida-top');if(!top){top=document.createElement('div');top.className='guida-top';document.body.insertBefore(top,document.body.firstChild)}
  const w=document.createElement('div');w.className='stampante-wrap';
  w.innerHTML=`<button type="button" class="stampante-btn" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 21h10M9 17v4M15 17v4"/></svg><span class="st-parola">Stampante</span> <b></b><i></i></button><div class="stampante-pop" hidden><b>Area di stampa</b><p>Dimensioni massime della tua stampante, in mm. Vale per tutte le guide: serve a segnalare i pezzi che non entrano.</p><div class="stampante-xyz">${['x','y','z'].map(k=>`<label><span>${k.toUpperCase()}</span><input data-k="${k}" type="number" min="50" max="2000" step="1" inputmode="numeric"></label>`).join('')}</div><p class="stampante-nome"></p><div class="st-cerca"><input type="search" placeholder="Cerca fra ${MODELLI.length} stampanti…" aria-label="Cerca la tua stampante" autocomplete="off" spellcheck="false"><ul hidden></ul></div><p class="stampante-esito"></p></div>`;
  top.insertBefore(w,top.firstChild);btn=w.querySelector('button');pop=w.querySelector('.stampante-pop');
  const inputs=[...pop.querySelectorAll('input')],xyz=inputs.filter(i=>i.dataset.k),nome=pop.querySelector('.stampante-nome'),carica=()=>{const b=get();xyz.forEach(i=>i.value=b[i.dataset.k]);nome.textContent=b.nome||''};carica();
  // a mano: il nome del modello non vale piu'
  xyz.forEach(i=>i.addEventListener('input',()=>{const v=Number(i.value);if(v>0){const b={...get(),[i.dataset.k]:v};delete b.nome;set(b);nome.textContent=''}}));
  StampanteCerca(pop.querySelector('.st-cerca input'),pop.querySelector('.st-cerca ul'),MODELLI,b=>{set(b);carica()});
  const mostra=on=>{pop.hidden=!on;btn.setAttribute('aria-expanded',on)};
  btn.addEventListener('click',e=>{e.stopPropagation();mostra(pop.hidden)});
  document.addEventListener('click',e=>{if(!pop.hidden&&!w.contains(e.target))mostra(false)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pop.hidden){mostra(false);btn.focus()}});
  // il pulsante del tema (tema.py) va nello stesso contenitore, dopo questo
  const sposta=()=>{const t=document.querySelector('.tema-guida');if(t&&t.parentNode!==top)top.appendChild(t)};sposta();
  new MutationObserver(sposta).observe(document.body,{childList:true});
  const main=document.querySelector('main');avviso=document.createElement('p');avviso.className='warning stampante-avviso';avviso.hidden=true;avviso.setAttribute('role','status');
  if(main)main.insertBefore(avviso,main.firstChild);
  addEventListener('storage',e=>{if(e.key===KEY){carica();update()}});
  check()}
window.StampanteGuide={get,set,fits,check,onChange:cb=>cbs.push(cb)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',monta);else monta();
})();</script><!--STAMPANTE-FINE-->
</body></html>
